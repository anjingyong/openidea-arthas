id = "allen.arthas"
name = "Arthas Commander"
version = "0.2.1"
description = "Build Arthas diagnostics from the file you are reading: watch, trace, stack, monitor, tt, ognl, field writes, Spring environment lookup, logger levels, the async-profiler and jad / sc / sm / dump — with the class, method and modifiers taken from the cursor. Attaches through arthas-boot when a jar is configured."
authors = ["allen"]
license = "MIT"
# The marketplace icon: an SVG at most 16 KiB, sanitised like file icons.
icon = "icons/arthas.svg"
change-notes = "0.2.1 — the context submenu now appears where it belongs: its `when` clause reads `editorLangId`, the key the editor publishes (`editorLang` is never set, so the whole submenu was silently dropped). 0.2.0 — the command set covers what the Arthas idea plugin offers: watch (method, static / instance field, force-invoke), trace, stack, monitor, tt (record, inspect, replay), ognl (static, instance, Spring bean), field (read, write, static final, setter, instances), the Spring environment (one key from your selection, or every property source in priority order), logger levels, async-profiler start / stop / dump, jad, sc / sm and dump. The caret distinguishes a method, a field, a constructor and a type, and the panel rebuilds every family from it in one message."
categories = ["tools"]
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-view:arthas.panel", "on-command:*"]

[capabilities]
# editor.read: the package, the enclosing type chain, the member around the cursor.
# process:java: the arthas-boot terminal, only when a jar is configured.
required = ["editor.read", "process:java"]
# clipboard: the command is copied so it can be pasted into any running session.
# process:jps: the target JVM list; without it the picker stays empty.
optional = ["clipboard", "process:jps"]

[[contributes.views]]
id = "arthas.panel"
title = "Arthas"
icon = "icons/arthas.svg"
location = "left"
# The page draws its own header row (target process, family tabs), like the design.
header = "none"
web = "webview/index.html"

[[contributes.commands]]
id = "arthas.open"
title = "Open Command Builder"
category = "Arthas"

[[contributes.commands]]
id = "arthas.targets"
title = "Refresh Target JVMs"
category = "Arthas"

[[contributes.commands]]
id = "arthas.watch"
title = "Watch (method / field / invoke)…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.trace"
title = "Trace Call Path…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.stack"
title = "Stack (who calls this)…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.monitor"
title = "Monitor (periodic stats)…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.tt"
title = "Time Tunnel (record / replay)…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.ognl"
title = "OGNL Expression…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.field"
title = "Read / Write Field…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.jad"
title = "Decompile (jad)…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.search"
title = "Search Class / Method (sc, sm)…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.dump"
title = "Dump Loaded Classes…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.spring"
title = "Spring Environment…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.logger"
title = "Logger Level…"
category = "Arthas"

[[contributes.commands]]
id = "arthas.profiler"
title = "Async Profiler (flame graph)…"
category = "Arthas"

# `editorLangId` is the enabled editor's language id — the key the editor
# controller publishes (`setContext("editorLangId", …)`), and the one every
# built-in feature uses. `editorLang` (the name the SDK doc comments still show)
# is never set, so a clause over it evaluates to false and the whole submenu
# disappears silently. The submenu therefore only appears where an Arthas class
# name can actually be derived. The ten code-scoped commands sit under "Arthas";
# the three that act on the running application rather than on this file sit
# under "Arthas App".
[[contributes.menus]]
menu = "editor.context"
command = "arthas.watch"
submenu = "Arthas"
when = "editorLangId == java || editorLangId == kotlin"

[[contributes.menus]]
menu = "editor.context"
command = "arthas.trace"
submenu = "Arthas"
when = "editorLangId == java || editorLangId == kotlin"

[[contributes.menus]]
